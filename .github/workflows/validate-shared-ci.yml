# Copy into a separate consumer repository. Replace waismeeran and 6b9f5af479a4b4fa012cd2271e0b2db6d1795341 only
# after the Shared CI repository and candidate revision are published.
name: Shared CI hosted validation
run-name: "Shared CI hosted validation: ${{ github.event.inputs.case }}"

on:
  workflow_dispatch:
    inputs:
      case:
        description: Case ID from fixtures/cases.json
        required: true
        type: choice
        options:
          - npm-conventional
          - npm-node22
          - npm-node26
          - pnpm-conventional
          - yarn4-conventional
          - custom-overrides
          - nested-working-directory
          - e2e-enabled
          - invalid-config
          - capability-failure
          - npm-cache-invalidation-before
          - npm-cache-invalidation-after
      working-directory:
        description: Exact fixture directory from the selected case in fixtures/cases.json
        required: true
        type: string
        default: fixtures/npm-full
      node-version:
        description: Node selector from the selected case (auto, 22, 24, or 26)
        required: false
        type: string
        default: '24'
      unit:
        description: Unit capability mode; use true for invalid-config
        required: false
        type: string
        default: auto
      e2e:
        description: Set true for e2e-enabled
        required: false
        type: string
        default: 'false'
      lint-command:
        description: Custom command for custom-overrides
        required: false
        type: string
      unit-command:
        description: Custom command for custom-overrides
        required: false
        type: string
      build-command:
        description: Custom command for custom-overrides
        required: false
        type: string

permissions:
  contents: read

jobs:
  shared-ci:
    uses: waismeeran/shared-ci/.github/workflows/node-ci.yml@6b9f5af479a4b4fa012cd2271e0b2db6d1795341
    with:
      node-version: ${{ github.event.inputs['node-version'] }}
      working-directory: ${{ github.event.inputs['working-directory'] }}
      unit: ${{ github.event.inputs.unit || 'auto' }}
      e2e: ${{ github.event.inputs.e2e || 'false' }}
      lint-command: ${{ github.event.inputs['lint-command'] }}
      unit-command: ${{ github.event.inputs['unit-command'] }}
      build-command: ${{ github.event.inputs['build-command'] }}
